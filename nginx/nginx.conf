user  nginx;
# One worker per core; "auto" lets nginx detect the container's CPU allocation.
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    # Accept as many connections as possible per wake-up instead of one at a time.
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $upstream_response_time exposes how long Next.js took vs. total request
    # time, which is what you need to tell "the app is slow" from "the network
    # is slow" when reading access logs.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    # ── Transfer tuning ────────────────────────────────────────────────────
    sendfile        on;      # kernel-space file sends, no user-space copy
    tcp_nopush      on;      # fill packets before sending (pairs with sendfile)
    tcp_nodelay     on;      # but don't delay small packets on keepalive conns
    keepalive_timeout  65;
    types_hash_max_size 4096;

    # Hide the nginx version in Server: and error pages.
    server_tokens   off;

    # Next.js server actions accept up to 10mb payloads (see next.config.ts);
    # nginx must not reject them first with a 413.
    client_max_body_size 10m;
    client_body_timeout  60s;
    client_header_timeout 60s;

    # ── Compression ────────────────────────────────────────────────────────
    # Next already compresses its own responses, but nginx handles anything it
    # serves or proxies without compression. gzip_vary keeps caches honest.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/rss+xml
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ── Rate limiting ──────────────────────────────────────────────────────
    # A cheap first line of defence in front of the app's own Redis-backed
    # limiter: this one costs no round-trip and sheds floods before they ever
    # reach Node. Limits are deliberately loose so normal browsing never trips
    # them — the application limiter enforces the real per-user policy.
    limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=api:10m     rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m    rate=5r/m;
    limit_req_status 429;

    # Cap concurrent connections per IP to blunt slowloris-style hoarding.
    limit_conn_zone $binary_remote_addr zone=conns:10m;
    limit_conn_status 429;

    # ── Proxy cache ────────────────────────────────────────────────────────
    # Shared disk cache for immutable build output, so repeat asset requests are
    # served by nginx and never wake Node. inactive= evicts entries nobody has
    # asked for; max_size caps total disk use.
    proxy_cache_path /var/cache/nginx/next
                     levels=1:2
                     keys_zone=next_static:10m
                     max_size=512m
                     inactive=7d
                     use_temp_path=off;

    # Collapse a stampede of identical requests into one upstream fetch, and
    # keep serving the old copy while it refreshes or if the app errors.
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;

    include /etc/nginx/conf.d/*.conf;
}
