# Named upstream so the proxy target lives in one place, and so keepalive can
# be configured — without it nginx opens a fresh TCP connection to Node for
# every single request, which is the most common Next-behind-nginx slowdown.
upstream nextjs {
    server web:3000;

    # Keep idle connections warm for reuse.
    keepalive 32;
    keepalive_timeout 60s;
}

# Reusable proxy settings. Kept in a snippet so every location block below
# stays in sync instead of drifting apart.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Behind Cloudflare Tunnel, TLS is terminated at Cloudflare's edge and the hop
# into nginx is plain HTTP — so $scheme says "http" even though the user is on
# https. Trust the forwarded value when present, and fall back to $scheme for
# direct local requests, so the app builds correct absolute URLs either way.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https   https;
    http    http;
}

# Cloudflare sends the visitor's real address in CF-Connecting-IP. Prefer it,
# since $remote_addr is the tunnel container for public traffic — without this
# every public visitor shares one rate-limit bucket.
map $http_cf_connecting_ip $real_client_ip {
    default $remote_addr;
    ~.      $http_cf_connecting_ip;
}

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # Requests that reach here are already inside Docker's network, coming from
    # the published port. Real client addresses are preserved below.

    # Next's own responses carry the security headers (see next.config.ts) and
    # the per-request CSP from proxy.ts, so they are NOT duplicated here —
    # setting them twice can produce conflicting policies. Only headers nginx
    # is uniquely positioned to add belong in this file.

    limit_conn conns 50;

    # ── Health check ───────────────────────────────────────────────────────
    # Answered by nginx itself so a monitor can distinguish "proxy is up" from
    # "app is up". Not logged, to keep access logs readable.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Immutable build assets ─────────────────────────────────────────────
    # Filenames are content-hashed by Next, so a given URL's bytes never change.
    # Cache them aggressively in the browser and skip the app entirely on
    # revalidation.
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache       next_static;
        proxy_cache_valid 200 30d;
        add_header X-Cache-Status $upstream_cache_status;

        # Next sends its own Cache-Control; add_header would append a second
        # one. Hide the upstream value so exactly one header reaches the client.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Files under public/ (logos, icons, og-image). Not content-hashed, so they
    # get a shorter TTL — long enough to help, short enough that replacing an
    # image actually shows up.
    location ~* ^/[^/]+\.(?:svg|png|jpg|jpeg|gif|webp|ico|txt|woff2?)$ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=86400";
    }

    # Next's on-the-fly optimised images. Expensive to generate, safe to cache.
    location /_next/image {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache       next_static;
        proxy_cache_valid 200 7d;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── Auth endpoints ─────────────────────────────────────────────────────
    # Tightest rate limit: these are the credential-stuffing targets. burst
    # absorbs a legitimate retry or two; nodelay serves the burst immediately
    # rather than queueing it.
    location ~ ^/api/(auth|.*sign-in|.*sign-up|.*password) {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # API responses are per-user; never let a proxy cache them.
        proxy_buffering off;
    }

    # ── Everything else (pages, server actions, HMR) ───────────────────────
    location / {
        limit_req zone=general burst=50 nodelay;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;

        # WebSocket / SSE upgrade support. Without these, streaming responses
        # and any realtime connection silently fail behind the proxy.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Don't sit on streamed/RSC payloads waiting for a full buffer.
        proxy_buffering off;

        # Pass upstream errors through rather than masking them with nginx's
        # own error pages, so app-rendered error states still reach the user.
        proxy_intercept_errors off;
    }
}
