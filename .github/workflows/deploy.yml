name: Deploy to VPS

on:
  workflow_run:
    workflows: ["Docker Publish"]
    types: [completed]
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://logitrackenterprise.emreceyhan.xyz
    steps:
      - name: Deploy edilecek immutable image tag'ini hesapla
        id: image
        run: |
          echo "sha_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: SSH and Deploy on VPS
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          # Şifreli SSH yerine anahtar: VPS'te PasswordAuthentication kapalı.
          key: ${{ secrets.VPS_SSH_KEY }}
          # Host anahtarı sabitlenir (MITM koruması). Go tabanlı drone-ssh sunucunun
          # ECDSA host anahtarını seçer (ED25519 değil), bu yüzden o sabitlenir.
          fingerprint: SHA256:UtCKVHXG5bBnNDapTZfr9AZLYriz7rRBSjIVz6uzdeY
          envs: IMAGE_TAG,PRODUCTION_ENV_FILE
          script: |
            set -e
            cd /home/logitrack/client

            # Tek kaynak GitHub Secret'taki PRODUCTION_ENV_FILE: build image'i
            # de bu dosyadan üretiliyor (bkz. docker.publish.yml), o yüzden
            # VPS'teki .env'i burada üzerine yazıyoruz ki NEXT_PUBLIC_* ve
            # runtime değişkenleri hep aynı kaynaktan gelsin, elle senkron
            # gerekmesin.
            printf '%s' "$PRODUCTION_ENV_FILE" > .env

            # Rollback için şu an çalışan image'ı kaydet.
            PREV_IMAGE=$(docker inspect client-web-1 --format '{{.Image}}' 2>/dev/null || true)

            docker pull emrecyhn/logitrack:${IMAGE_TAG}
            docker tag emrecyhn/logitrack:${IMAGE_TAG} emrecyhn/logitrack:latest

            # `down` yok: `up -d` yalnızca değişen servisi yeniden yaratır,
            # diğer container'lar (ör. email-service) hiç durmaz. Web için
            # kesinti yalnızca tek container'ın yeniden başlama süresi kadardır.
            docker compose up -d

            healthy() {
              for i in $(seq 1 12); do
                STATUS=$(curl -s -k -o /dev/null -w "%{http_code}" -H "Host: logitrackenterprise.emreceyhan.xyz" "https://localhost/healthz" || echo "000")
                if [ "$STATUS" = "200" ]; then
                  echo "Servis ayakta (HTTP $STATUS)."
                  return 0
                fi
                echo "Bekleniyor... deneme $i (HTTP $STATUS)"
                sleep 5
              done
              return 1
            }

            if healthy; then
              echo "Deploy başarılı."
              docker image prune -f
              exit 0
            fi

            echo "Health check başarısız!"
            if [ -n "$PREV_IMAGE" ]; then
              echo "Önceki sürüme geri dönülüyor: $PREV_IMAGE"
              docker tag "$PREV_IMAGE" emrecyhn/logitrack:latest
              docker compose up -d
              if healthy; then
                echo "Rollback başarılı; önceki sürüm ayakta. Bu deploy BAŞARISIZ sayılıyor."
              else
                echo "Rollback sonrası da servis sağlıksız! Elle müdahale gerekli."
              fi
            fi
            exit 1
        env:
          IMAGE_TAG: ${{ steps.image.outputs.sha_short }}
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
