name: Logitrack CI

# `push` tetikleyicisi bilinçli olarak yok: main'e push edilen kod
# docker.publish.yml içinden bu workflow'u (workflow_call) çalıştırır ve
# image build/deploy yalnızca testler geçerse ilerler.
on:
  pull_request:
    branches: ["main", "master"]
  workflow_call:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      # documents.test.ts gibi bazı testler gerçek ../redis modülünü import eder;
      # ulaşılabilir bir Redis yoksa bağlantı denemesinde asılı kalır.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "ci-dummy-jwt-secret-at-least-32-chars-long"

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint code
        run: npm run lint -- --max-warnings=0

      - name: Type check
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm test

      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
