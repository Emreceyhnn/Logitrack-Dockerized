services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    # Pulled from the registry, not built here: the VPS only has this file, .env
    # and nginx/ — there is no source tree to build from. The image is built and
    # pushed from the dev machine (see README), so a deploy is pull + up.
    image: emrecyhn/logitrack:latest
    # No `ports:` — the app is reachable only through nginx on the compose
    # network. Publishing 3000 as well would let clients bypass the proxy (and
    # its rate limits) entirely.
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      # Overrides the .env value: inside the container `localhost` is the web
      # container itself, so the database has to be reached by service name.
      # The role/password/db come from POSTGRES_* in .env — they must keep
      # matching the postgres service below (and the postgres_data volume,
      # which only re-applies POSTGRES_USER/PASSWORD on an empty data
      # directory) or auth fails with a misleading "credentials are not
      # valid" (really: role does not exist).
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is not set in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is not set in .env}?schema=public"
      REDIS_URL: "redis://redis:6379"
    restart: unless-stopped
    # node-alpine has no curl/wget by default, so the check is done with Node
    # itself. Any HTTP status counts as healthy — a redirect still proves the
    # server is accepting and routing connections.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      # Set in .env — kept out of this file since docker-compose.yml is
      # tracked in git (.env is gitignored). See DATABASE_URL above: the web
      # service's connection string is built from these same three values,
      # so they only need to be correct in one place.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bound to 127.0.0.1 so pgAdmin/Prisma Studio on this machine still work,
      # but the database is not reachable from the network. A bare "5432:5432"
      # would listen on every interface.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Cache data is disposable, but AOF keeps it across restarts so a redeploy
    # doesn't stampede the database with a fully cold cache.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redis_data:/data
    ports:
      # Localhost-only, same reasoning as postgres: redis-cli stays usable from
      # this machine without exposing an unauthenticated cache to the network.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  email-service:
    image: emrecyhn/logitrack-email-service:latest
    restart: always
    environment:
      - EMAIL_HOST=${EMAIL_HOST:?EMAIL_HOST is not set in .env}
      - EMAIL_PORT=${EMAIL_PORT:?EMAIL_PORT is not set in .env}
      - EMAIL_USER=${EMAIL_USER:?EMAIL_USER is not set in .env}
      - EMAIL_PASS=${EMAIL_PASS:?EMAIL_PASS is not set in .env}
      - FROM_EMAIL=${EMAIL_FROM:?EMAIL_FROM is not set in .env}
      - LOGITRACK_BASE_URL=${NEXT_PUBLIC_BASE_URL:?NEXT_PUBLIC_BASE_URL is not set in .env}
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
  nginx_cache:
